<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fafcfe"/>
    <stop offset="1" stop-color="#c7e2fb"/>
  </linearGradient>
  <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#edf5ff"/>
    <stop offset="1" stop-color="#b8ccec"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="9" dy="12" stdDeviation="7" flood-color="#526070" flood-opacity=".48"/>
  </filter>
</defs>

<!-- document -->
<path d="M83 16H550L693 159V765H83Z" fill="url(#paper)" stroke="#748fc5" stroke-width="16"/>

