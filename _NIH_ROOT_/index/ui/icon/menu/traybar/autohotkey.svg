<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8ddb7"/>
      <stop offset="48%" stop-color="#76ad76"/>
      <stop offset="100%" stop-color="#0b5b0f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset dx="10" dy="13" result="off"/>
      <feFlood flood-color="#17351a" flood-opacity=".72" result="color"/>
      <feComposite in="color" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded green tile -->
  <rect x="5" y="5" width="790" height="790" rx="198" ry="198"
        fill="url(#bg)" stroke="#075d0c" stroke-width="10"/>

